name: tests

on:
  push:
  pull_request:

jobs:
  pure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pure checks
        run: python3 -m unittest discover -s tests -p 'test_*.py'
