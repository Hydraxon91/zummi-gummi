name: Deploy Pages

# Publishes the files the browser actually loads. /vendor and /src are copied
# whole, so a new runtime module ships with no change to this workflow. Jekyll
# is not involved (the artifact is served as static files), so no .nojekyll.
on:
  workflow_run:
    workflows: ["Smoke test"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# One live deployment at a time; never cancel a production deploy in flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    name: Publish the app to GitHub Pages
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Check the tested revision is still current
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          current="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          if [ "$current" = "$TESTED_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping superseded tested revision $TESTED_SHA"
          fi

      - uses: actions/configure-pages@v6
        if: steps.revision.outputs.current == 'true'

      - name: Stage the runtime files
        if: steps.revision.outputs.current == 'true'
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp index.html LICENSE _site/
          cp -R src vendor assets _site/
          for f in index.html LICENSE src/app.js src/config.js src/box3d.js vendor/box3d/box3d.js vendor/box3d/box3d.wasm assets/MSN_Figure/msn.glb; do
            test -f "_site/$f" || { echo "::error::missing _site/$f"; exit 1; }
          done
          find _site -maxdepth 1 -mindepth 1 | sort

      - uses: actions/upload-pages-artifact@v5
        if: steps.revision.outputs.current == 'true'
        with:
          path: _site

      - name: Deploy to GitHub Pages
        if: steps.revision.outputs.current == 'true'
        id: deployment
        uses: actions/deploy-pages@v5
