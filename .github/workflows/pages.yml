name: Deploy Pages

# Publishes the files the browser actually loads. /vendor and /src are copied
# whole, so a new runtime module ships with no change to this workflow. Jekyll
# is not involved (the artifact is served as static files), so no .nojekyll.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One live deployment at a time; never cancel a production deploy in flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    name: Publish the app to GitHub Pages
    # TODO: restore ubuntu-latest after the Oct 2026 runner-image migration.
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/configure-pages@v6

      - name: Stage the runtime files
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp index.html LICENSE _site/
          cp -R src vendor assets _site/
          for f in index.html LICENSE src/app.js src/config.js src/box3d.js vendor/box3d/box3d.js vendor/box3d/box3d.wasm assets/MSN_Figure/msn.glb; do
            test -f "_site/$f" || { echo "::error::missing _site/$f"; exit 1; }
          done
          find _site -maxdepth 1 -mindepth 1 | sort

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
