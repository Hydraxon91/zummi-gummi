name: Smoke test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      browsers: ${{ steps.scope.outputs.browsers }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - name: Classify changed paths
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/ci-policy.mjs

  serve-and-load:
    name: Serve the app and load the wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - uses: actions/setup-node@v7
        with:
          node-version: "26"

      - name: Check species, DNA, save and asset manifests
        run: node --test tests

      - name: Check behavior port markers
        run: node scripts/check-port-markers.mjs --expected scripts/port-markers.txt

      - name: Start the launcher
        run: |
          set -euo pipefail
          python3 launch.py --no-open --verbose --port 8000 > server.log 2>&1 &
          for _ in $(seq 1 60); do
            grep -q "This computer :" server.log && break
            sleep 0.25
          done
          cat server.log
          url="$(grep -o 'http://localhost:[0-9]*/' server.log | head -1)"
          if [ -z "$url" ]; then
            echo "::error::launch.py did not report a listening URL"
            exit 1
          fi
          echo "BASE_URL=$url" >> "$GITHUB_ENV"

      - name: Smoke test the served build
        run: node scripts/smoke.mjs "$BASE_URL"

      - name: Show server log on failure
        if: failure()
        run: cat server.log

  browser:
    name: Browser (${{ matrix.name }})
    needs: [changes, serve-and-load]
    if: needs.changes.outputs.browsers == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      LOW_QUALITY: "1"
      WIDTH: "900"
      HEIGHT: "600"
      TAG: ci-${{ matrix.name }}
      SCENARIO: ${{ matrix.scenario }}
      FAST: ${{ matrix.fast }}
      STALL_DIAGNOSTICS: "1"
      RENDER_COMPARISON: ${{ matrix.render == 'opaque' && '1' || '0' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: core
            script: BROWSER_SCOPE=core node scripts/browser-regression.mjs
          - name: parity
            script: node scripts/behavior-browser-parity.mjs
          - name: settings
            scenario: settings
            script: node scripts/social-test.mjs
          - name: pair
            render: opaque
            scenario: pair
            fast: "1"
            script: node scripts/social-test.mjs
          - name: rivalry
            render: opaque
            scenario: rivalry
            fast: "1"
            script: node scripts/social-test.mjs
          - name: partnership
            render: opaque
            scenario: partnership
            fast: "1"
            script: node scripts/social-test.mjs
          - name: groups
            render: opaque
            scenario: groups
            fast: "1"
            script: node scripts/social-test.mjs
          - name: glass-social
            render: opaque
            scenario: glass
            fast: "1"
            script: node scripts/social-test.mjs
          - name: gift-flow
            render: opaque
            scenario: flow
            fast: "1"
            script: node scripts/gifting-test.mjs
          - name: gift-carry
            scenario: carry
            fast: "0"
            script: node scripts/gifting-test.mjs
          - name: gift-persistence
            render: opaque
            scenario: persistence
            fast: "1"
            script: node scripts/gifting-test.mjs
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - uses: actions/setup-node@v7
        with:
          node-version: "26"

      - name: Resolve a Chromium-family browser
        run: |
          set -euo pipefail
          browser_bin=""
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then
              browser_bin="$(command -v "$candidate")"
              break
            fi
          done
          if [ -z "$browser_bin" ]; then
            echo "::error::No Chromium-family browser found on the runner"
            exit 1
          fi
          echo "BROWSER_BIN=$browser_bin" >> "$GITHUB_ENV"
          "$browser_bin" --version

      - name: Start the launcher
        run: |
          set -euo pipefail
          python3 launch.py --no-open --verbose --port 8000 > server.log 2>&1 &
          for _ in $(seq 1 60); do
            grep -q "This computer :" server.log && break
            sleep 0.25
          done
          cat server.log
          url="$(grep -o 'http://localhost:[0-9]*/' server.log | head -1)"
          if [ -z "$url" ]; then
            echo "::error::launch.py did not report a listening URL"
            exit 1
          fi
          if [ "${{ matrix.render }}" = "opaque" ]; then
            url="${url}?testRender=opaque"
          fi
          echo "GAME_URL=$url" >> "$GITHUB_ENV"

      - name: Run the scenario
        run: ${{ matrix.script }}

      - name: Upload scenario diagnostics and timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-${{ matrix.name }}-${{ github.run_attempt }}
          path: |
            .dev-shots/*.json
            .dev-shots/*.png
            server.log
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7

      - name: Show server log on failure
        if: failure()
        run: cat server.log

  required:
    name: Required CI checks
    if: always()
    needs: [changes, serve-and-load, browser]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - name: Require every applicable job to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
          BROWSERS: ${{ needs.changes.outputs.browsers }}
        run: |
          export RESULTS="$(node -e 'const r=JSON.parse(process.env.RESULTS); console.log(JSON.stringify(Object.fromEntries(Object.entries(r).map(([k,v])=>[k,v.result]))))')"
          node scripts/ci-policy.mjs gate
